<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №1 — Облік кафедри</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .tabs { margin-bottom: 15px; }
        .tab-btn { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; margin-right: 5px; }
        .tab-btn.active { background: #007bff; color: white; border-color: #0056b3; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .badge { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; margin-right: 4px; display: inline-block; font-size: 13px; }
    </style>
</head>
<body>

    <h1>Система управління кафедрою (Лаб. робота №1)</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('teachers')">Викладачі</button>
        <button class="tab-btn" onclick="switchTab('disciplines')">Дисципліни</button>
        <button class="tab-btn" onclick="switchTab('groups')">Групи студентів</button>
    </div>

    <!-- ТАБ 1: Викладачі -->
    <div id="teachers" class="tab-content active">
        <h2>Викладачі кафедри</h2>
        <table>
            <thead>
                <tr>
                    <th>ПІБ</th>
                    <th>Посада</th>
                    <th>Науковий ступінь</th>
                </tr>
            </thead>
            <tbody id="teachersTableBody"></tbody>
        </table>
    </div>

    <!-- ТАБ 2: Дисципліни -->
    <div id="disciplines" class="tab-content">
        <h2>Дисципліни</h2>
        <table>
            <thead>
                <tr>
                    <th>Назва</th>
                    <th>Курс</th>
                    <th>Обсяг (кредити)</th>
                </tr>
            </thead>
            <tbody id="disciplinesTableBody"></tbody>
        </table>
    </div>

    <!-- ТАБ 3: Групи студентів -->
    <div id="groups" class="tab-content">
        <h2>Групи студентів</h2>
        <table>
            <thead>
                <tr>
                    <th>Назва групи</th>
                    <th>Спеціальність</th>
                    <th>Курс</th>
                    <th>Кількість студентів</th>
                    <th>Викладач</th>
                    <th>Дисципліна</th>
                </tr>
            </thead>
            <tbody id="groupsTableBody"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
